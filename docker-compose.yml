services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      DATABASE_URL: postgres://checkout:checkout@postgres:5432/checkout
    depends_on: [postgres]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    ports: ["5432:5432"]
    volumes:
      - checkout-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
volumes:
  checkout-data:
