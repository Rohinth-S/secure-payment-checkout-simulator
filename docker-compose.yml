services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      DATABASE_URL: postgres://checkout:checkout@postgres:5432/checkout
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    ports: ["5432:5432"]
    volumes:
      - checkout-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./sql/002-provider-columns.sql:/docker-entrypoint-initdb.d/002-provider-columns.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  checkout-data:
